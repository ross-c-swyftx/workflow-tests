name: probe-reusable
on:
  workflow_call:
    inputs:
      env: {type: string, required: true}
permissions:
  id-token: write
  contents: read
jobs:
  inner:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/claims
        with:
          marker: reusable-EDITED-in-PR
          expect: "reusable called @main: MARKER reusable-from-main even when the PR edits this file; sub context environment:${{ inputs.env }}; job_workflow_ref probe-reusable.yaml@refs/heads/main"
