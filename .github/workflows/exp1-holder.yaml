name: exp1 holder
run-name: exp1-holder ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag: { required: true, type: string }
      seconds: { required: false, type: string, default: '150' }

jobs:
  hold:
    runs-on: ubuntu-latest
    concurrency:
      group: exp1
      cancel-in-progress: false
    steps:
      - run: sleep "${{ inputs.seconds }}"
