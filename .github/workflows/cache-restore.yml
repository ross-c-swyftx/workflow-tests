name: cache-restore-main
on:
  workflow_dispatch:
# Runs ONLY on main (default branch). Attempts to restore caches that were
# written from a feature branch (refs/heads/poison-writer) and from a same-repo
# PR (refs/pull/N/merge). GitHub's documented rule: a run restores only from its
# own ref scope + the default branch (+ PR base). So a MAIN run should see main
# scope only, never a branch's or a PR's cache.
permissions:
  contents: read
  actions: read
jobs:
  restore-actions-cache:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ref=${{ github.ref }} event=${{ github.event_name }} default=${{ github.event.repository.default_branch }}"
          echo "EXPECT (per GitHub ref-scoping): both restores MISS -> fail-on-cache-miss fails -> BLOCKED."
          echo "If either restores a branch/PR sentinel -> CONFIRMED (scoping leaks branch->main)."
      - id: restore_branch
        name: restore BRANCH-written actions/cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cached-dir-branch
          key: poison-f1a-branch
          fail-on-cache-miss: true
      - id: restore_pr
        name: restore PR-written actions/cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: cached-dir-pr
          key: poison-f1a-pr
          fail-on-cache-miss: true
      - name: report
        run: |
          echo "=== F1a actions/cache branch->main ==="
          echo "branch restore outcome=${{ steps.restore_branch.outcome }} cache-hit=${{ steps.restore_branch.outputs.cache-hit }}"
          if [ -f cached-dir-branch/sentinel.txt ]; then echo "BRANCH CONTENT:"; cat cached-dir-branch/sentinel.txt; echo "F1a BRANCH: CONFIRMED"; else echo "F1a BRANCH: BLOCKED (no branch cache on main)"; fi
          echo "--- PR variant ---"
          echo "pr restore outcome=${{ steps.restore_pr.outcome }} cache-hit=${{ steps.restore_pr.outputs.cache-hit }}"
          if [ -f cached-dir-pr/sentinel.txt ]; then echo "PR CONTENT:"; cat cached-dir-pr/sentinel.txt; echo "F1a PR: CONFIRMED"; else echo "F1a PR: BLOCKED (no PR cache on main)"; fi
  restore-buildkit-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: write Dockerfiles (byte-identical to the writers' per-scope markers)
        run: |
          cat > Dockerfile.branch <<'EOF'
          FROM alpine:3.20
          RUN echo "SENTINEL-BUILDKIT-BRANCH" > /sentinel.txt && sleep 25 && cat /sentinel.txt
          EOF
          cat > Dockerfile.pr <<'EOF'
          FROM alpine:3.20
          RUN echo "SENTINEL-BUILDKIT-PR" > /sentinel.txt && sleep 25 && cat /sentinel.txt
          EOF
      - name: build with cache-from BRANCH gha scope
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.branch
          push: false
          load: true
          tags: poison-branch:main
          cache-from: type=gha,scope=swyftx-f1b-branch
      - name: build with cache-from PR gha scope
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pr
          push: false
          load: true
          tags: poison-pr:main
          cache-from: type=gha,scope=swyftx-f1b-pr
      - name: note
        run: |
          echo "Read each build step log. CACHED on the RUN layer => main pulled the branch/PR gha cache (CONFIRMED)."
          echo "RUN re-executes 25s (not CACHED) => BLOCKED."
