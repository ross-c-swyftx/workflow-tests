name: claims
description: Request an OIDC token for a throwaway audience and print its claims. Never prints the token.
inputs:
  marker: {required: true}
  expect: {required: true}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MARKER: ${{ inputs.marker }}
        EXPECT: ${{ inputs.expect }}
      run: |
        set -euo pipefail
        echo "EXPECT: $EXPECT"
        echo "MARKER (which copy of the workflow ran): $MARKER"
        echo "event=${{ github.event_name }} ref=${{ github.ref }} attempt=${{ github.run_attempt }}"
        tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sandbox-probe" | jq -r .value)
        p=$(cut -d. -f2 <<<"$tok" | tr '_-' '/+'); while (( ${#p} % 4 )); do p="$p="; done
        base64 -d <<<"$p" | jq '{sub, aud, environment, ref, event_name, workflow_ref, job_workflow_ref}'
